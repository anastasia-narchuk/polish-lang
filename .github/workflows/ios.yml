name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: Core tests and app build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core unit tests
        working-directory: ios
        run: swift test

      - name: Build the app for the iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project PolishLang.xcodeproj \
            -scheme PolishLang \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Build errors
        if: failure()
        working-directory: ios
        run: grep -E "error:|warning: .*(deprecated|ambiguous)" build.log | sort -u | head -200 || true
